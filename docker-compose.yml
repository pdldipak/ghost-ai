services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

  app-dev:
    profiles:
      - dev
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"

volumes:
  app_node_modules:
